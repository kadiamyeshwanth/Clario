# Whole stack on one machine:  docker compose up --build
#   web  → http://localhost:8080
#   api  → http://localhost:5000/api/v1/health
# Set JWT_SECRET (and optional keys) in a .env file next to this compose file.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 6

  api:
    build: ./finance-tracker-backend
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      MONGODB_URI: mongodb://mongo:27017/clario
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (48+ random characters)}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    ports: ["5000:5000"]

  web:
    build:
      context: ./finance-tracker
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  mongo-data:
