# Render Blueprint for Clario v3 (set "Blueprint path" to clario/render.yaml).
services:
  - type: web
    name: clario-api
    runtime: node
    rootDir: clario/server
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false        # e.g. https://clario-web.onrender.com
      - key: BACKEND_URL
        sync: false        # e.g. https://clario-api.onrender.com (used in SMS webhook URLs)
      - key: CORS_ORIGIN
        sync: false        # extra allowed origins, comma-separated
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false        # password-reset email over HTTPS (Render free blocks SMTP)
      - key: EMAIL_USER
        sync: false
      - key: RUN_CRON
        value: "true"      # keep true on exactly one instance

  - type: web
    name: clario-web
    runtime: static
    rootDir: clario/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # e.g. https://clario-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
